# test-workloads/bad-probe-service.yaml
# Intentionally broken app: Liveness probe checks invalid port 8080 (app listens on port 80)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-probe-service
  namespace: sandbox-apps
  labels:
    app: bad-probe-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-probe-service
  template:
    metadata:
      labels:
        app: bad-probe-service
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
