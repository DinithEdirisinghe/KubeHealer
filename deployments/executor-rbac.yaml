# deployments/executor-rbac.yaml
# RBAC Security Hardening: Grants write access ONLY to k8s-executor-sa inside sandbox-apps
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-executor-sa
  namespace: kubehealer-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-executor-role
  namespace: sandbox-apps
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["deployments", "statefulsets", "daemonsets", "pods", "pods/log", "events"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-executor-binding
  namespace: sandbox-apps
subjects:
  - kind: ServiceAccount
    name: k8s-executor-sa
    namespace: kubehealer-system
roleRef:
  kind: Role
  name: k8s-executor-role
  apiGroup: rbac.authorization.k8s.io
