apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-gateway
  namespace: kubehealer-system
  labels:
    app: alert-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-gateway
  template:
    metadata:
      labels:
        app: alert-gateway
    spec:
      containers:
        - name: alert-gateway
          image: kubehealer/alert-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: "redis-master.kubehealer-infra.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              value: "kubehealerredis"
            - name: KAFKA_BROKER
              value: "kafka.kubehealer-infra.svc.cluster.local:9092"
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: alert-gateway
  namespace: kubehealer-system
spec:
  type: ClusterIP
  selector:
    app: alert-gateway
  ports:
    - port: 8080
      targetPort: 8080
