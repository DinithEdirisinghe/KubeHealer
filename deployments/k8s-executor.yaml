apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-executor
  namespace: kubehealer-system
  labels:
    app: k8s-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-executor
  template:
    metadata:
      labels:
        app: k8s-executor
    spec:
      serviceAccountName: k8s-executor-sa
      containers:
        - name: k8s-executor
          image: kubehealer/k8s-executor:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: PORT
              value: "50051"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-executor
  namespace: kubehealer-system
spec:
  type: ClusterIP
  selector:
    app: k8s-executor
  ports:
    - port: 50051
      targetPort: 50051
