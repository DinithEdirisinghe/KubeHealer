# kind-config.yaml
# 3-Node Kubernetes Cluster Configuration for KubeHealer
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # Control Plane (Master Node)
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
      - containerPort: 30090
        hostPort: 8080
        protocol: TCP

  # Worker Node 1
  - role: worker

  # Worker Node 2
  - role: worker
