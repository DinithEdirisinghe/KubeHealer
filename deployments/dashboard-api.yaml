apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: kubehealer-system
  labels:
    app: dashboard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      containers:
        - name: dashboard-api
          image: kubehealer/dashboard-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: KAFKA_BROKER
              value: "kafka.kubehealer-infra.svc.cluster.local:9092"
            - name: EXECUTOR_GRPC_ADDR
              value: "k8s-executor.kubehealer-system.svc.cluster.local:50051"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
  namespace: kubehealer-system
spec:
  type: NodePort
  selector:
    app: dashboard-api
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30090
